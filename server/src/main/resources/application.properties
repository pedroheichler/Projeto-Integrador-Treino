spring.application.name=kronos-server
server.port=${PORT:8080}

# Banco de dados. Em hospedagens que entregam DATABASE_URL (postgres://...),
# a conversão para JDBC é feita em KronosServerApplication.
spring.datasource.url=${KRONOS_DB_URL:jdbc:postgresql://localhost:5432/kronos}
spring.datasource.username=${KRONOS_DB_USER:kronos}
spring.datasource.password=${KRONOS_DB_PASSWORD:kronos}

# Kronos IA. A chave vem só do ambiente, nunca do código (RNF04).
kronos.ai.api-key=${ANTHROPIC_API_KEY:}
kronos.ai.model=${KRONOS_AI_MODEL:claude-opus-5-5}
kronos.ai.base-url=${ANTHROPIC_BASE_URL:}

# Não devolve detalhes internos nas respostas de erro
server.error.include-message=never
server.error.include-stacktrace=never
